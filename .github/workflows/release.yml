# This is a GitHub Action workflow to automate the release process.
# For more information about GitHub Actions, see: https://docs.github.com/en/actions

name: Create Release

# Controls when the workflow will run.
on:
  # Triggers the workflow on push events, but only for tags that start with 'v'.
  # For example: v1.0, v1.2.3, v2.0-beta
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel.
jobs:
  # This workflow contains a single job called "build_and_release".
  build_and_release:
    # The type of runner that the job will run on.
    runs-on: ubuntu-latest
    # Grant permissions for the GITHUB_TOKEN to create a release.
    permissions:
      contents: write

    # Steps represent a sequence of tasks that will be executed as part of the job.
    steps:
      # Step 1: Check out your repository under $GITHUB_WORKSPACE, so your job can access it.
      - name: Checkout code
        uses: actions/checkout@v5

      # Step 2: Create the directory structure and archive the project source into a zip file.
      # Unified exclusion via .releaseignore; CI uses zip -x@exclude.list.
      - name: Archive project source with zip
        run: |
          PACKAGE_NAME="assistant.koplugin"
          ARCHIVE_NAME="${PACKAGE_NAME}-${GITHUB_REF_NAME}.zip"
          echo "Building release archive from .releaseignore..."
          if [ -f .releaseignore ]; then cat .releaseignore; echo "---"; else echo "WARNING: .releaseignore missing"; fi
          rm -rf "$PACKAGE_NAME" "$ARCHIVE_NAME"
          git archive --format=tar --prefix="$PACKAGE_NAME/" "$GITHUB_REF_NAME" | tar xf -
          VERSION=${GITHUB_REF_NAME#v}
          echo "Updating version to $VERSION in $PACKAGE_NAME/_meta.lua"
          sed -i -E "s/(version\s*=\s*)[^,]+/\1\"${VERSION}\"/" "$PACKAGE_NAME/_meta.lua"
          cat "$PACKAGE_NAME/_meta.lua"
          if [ -f .releaseignore ]; then
            python3 -c "pkg='assistant.koplugin'; raw=[l.strip().rstrip('/') for l in open('.releaseignore') if (t:=l.strip()) and not t.startswith('#') and not t.startswith('!') and t.rstrip('/')]; open('/tmp/exclude.list','w').write('\n'.join([f'{pkg}/{p}\n{pkg}/{p}/*\n*/{p}\n*/{p}/*' for p in raw]) + f'\n{pkg}/.*\n*/.*\n.git/*\n')"
            echo "exclude.list:"; cat /tmp/exclude.list; echo "---"
            zip -r "$ARCHIVE_NAME" "$PACKAGE_NAME" -x@/tmp/exclude.list
          else
            zip -r "$ARCHIVE_NAME" "$PACKAGE_NAME"
          fi
          echo "Archive created: $ARCHIVE_NAME"

      # Step 4: List files in the created archive for debugging purposes.
      - name: List archive contents
        run: unzip -l assistant.koplugin-${GITHUB_REF_NAME}.zip

      # Step 5: Create a GitHub Release and upload the archive as a release asset.
      - name: Create Release and Upload Asset
        uses: softprops/action-gh-release@v3
        with:
          prerelease: false
          make_latest: true
          # The files to upload as release assets.
          files: assistant.koplugin-${{ github.ref_name }}.zip